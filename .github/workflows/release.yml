name: Release

# A tag cuts a release: the app is built for both architectures, put in a disk
# image, attached to the tag, and its cask updated in the Homebrew tap. The
# Verify workflow runs on the same push, so what ships has passed the checks.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    # Two architectures from cold, so roughly twice what Verify's single build
    # takes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version-file: ".node-version"
          run-install: false
          cache: true
      - run: vp install --frozen-lockfile
      - name: Use project toolchain
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      # The runner's own architecture is already there; the other one is what
      # makes the build universal.
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Check the tag against the versions declared
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./src-tauri/tauri.conf.json').version")
          packaged=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$declared" ] || [ "$tagged" != "$packaged" ]; then
            echo "Tag $GITHUB_REF_NAME, tauri.conf.json $declared and package.json $packaged disagree" >&2
            exit 1
          fi
          echo "version=$tagged" >> "$GITHUB_ENV"

      - run: vp run dmg:build

      - name: Find the disk image and measure it
        run: |
          set -euo pipefail
          # A missing target builds one architecture and says nothing, and the
          # people it leaves out are the ones who cannot run it at all.
          arches=$(lipo -archs src-tauri/target/universal-apple-darwin/release/overwatch)
          for want in arm64 x86_64; do
            case " $arches " in
              *" $want "*) ;;
              *) echo "Built without $want: $arches" >&2; exit 1 ;;
            esac
          done
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          echo "dmg=$dmg" >> "$GITHUB_ENV"
          echo "sha256=$(shasum -a 256 "$dmg" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "Built $(basename "$dmg")"

      - name: Attach it to the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Install with Homebrew:

          ```sh
          brew install --cask joeychilson/tap/overwatch
          ```

          Or take the disk image below. The app is not notarized — Apple charges
          for that — so macOS stops it the first time it is opened, however it
          arrived. Open **System Settings → Privacy & Security**, scroll to the
          bottom, and choose **Open Anyway**.
          NOTES
          printf '\nsha256: `%s`\n' "$sha256" >> notes.md
          # The notes above are prepended to the list of changes GitHub works
          # out from the commits since the last tag.
          gh release create "$GITHUB_REF_NAME" "$dmg" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag

      # Kept last: a release that is already published is worth having even if
      # the tap cannot be reached, and re-running the job repeats this step
      # alone once the token is in place.
      - name: Point the Homebrew tap at it
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "No TAP_TOKEN secret; leaving the tap alone." >&2
            exit 0
          fi
          remote="https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git"
          git init -q -b main tap
          git -C tap remote add origin "$remote"
          if git -C tap ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            git -C tap fetch -q --depth 1 origin main
            git -C tap reset -q --hard origin/main
          fi
          # Run from the repository, which is where the app describes itself.
          node scripts/cask.ts \
            --sha256 "$sha256" \
            --asset "$(basename "$dmg")" \
            --repo "$GITHUB_REPOSITORY" \
            --out tap
          git -C tap add Casks api
          git -C tap \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "overwatch ${version}"
          git -C tap push -q origin main
          echo "Tap updated to ${version}."
