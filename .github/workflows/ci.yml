name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "26"
          cache: true
          run-install: false
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Check generated native bindings
        run: |
          cargo run --manifest-path src-tauri/Cargo.toml --locked --bin bindings
          git diff --exit-code -- src/lib/bindings.ts
      - name: Test frontend accounting
        run: vp test run
      - name: Check frontend and build desktop app
        run: vp run tauri build --debug --no-bundle -- --locked
      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Install test browsers
        run: vp exec playwright install chromium webkit
      - name: Test UI workflows
        run: vp exec playwright test --workers 2
      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
