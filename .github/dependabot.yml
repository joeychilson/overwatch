# Every dependency here is pinned to an exact version, which keeps builds
# reproducible and leaves nothing to notice when one falls behind. These are
# the notices. Each ecosystem is raised as one grouped pull request a week
# rather than one per package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # TypeScript 7 is the native port, and SvelteKit reaches into the package
      # for what it no longer exposes: `svelte-kit sync` dies in `load_tsconfig`
      # before anything is installed, which fails the whole group with it. Lift
      # this once SvelteKit reads the new package, and take the major
      # deliberately rather than as one line of a weekly bump.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
