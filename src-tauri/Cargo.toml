[package]
name = "overwatch"
default-run = "overwatch"
version = "0.1.0"
description = "Explore coding-agent sessions, token usage, and costs on your desktop."
authors = ["Joey Chilson"]
repository = "https://github.com/joeychilson/overwatch"
license = "MIT"
edition = "2024"

[lib]
# Keep the library name distinct from the binary on Windows.
name = "overwatch_lib"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.38", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
walkdir = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["sync", "time"] }
sha2 = "0.10"
base64 = "0.22"
keyring = "4.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "history"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
