[package]
name = "overwatch"
version = "0.3.0"
description = "Local coding session history, model usage, and cost insights"
license = "MIT"
authors = ["Joey Chilson"]
readme = "../README.md"
repository = "https://github.com/joeychilson/overwatch"
publish = false
edition = "2024"
rust-version = "1.98"

[lib]
name = "overwatch_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
memchr = "2.8.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.20"
base64 = "0.23.1"
dirs = "6.0.0"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-window-state = "2.4.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
items_after_test_module = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
